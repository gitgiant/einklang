<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>einklang</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px ui-monospace, Consolas, monospace; color: #ddd; touch-action: manipulation; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #c { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #hud { position: fixed; left: 8px; bottom: 8px; background: #000a; padding: 6px 8px; white-space: pre; pointer-events: none; border-radius: 4px; }
  #panel { position: fixed; top: 8px; left: 8px; background: #000c; padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; max-width: 95vw; border-radius: 6px; }
  button, input, select { font: inherit; background: #222; color: #ddd; border: 1px solid #555; padding: 4px 6px; border-radius: 3px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #f88; text-align: center; padding: 2em; }
  #hosts { position: fixed; top: 64px; left: 8px; background: #000c; padding: 8px; border-radius: 6px; display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: center; }
  #hosts .me { color: #7fe3ff; }
  .row { display: contents; }
  #debug { position: fixed; top: 8px; right: 8px; background: #000d; padding: 8px; border-radius: 6px; max-width: min(640px, 60vw); max-height: 92vh; overflow: auto; }
  #debug canvas { width: 600px; max-width: 100%; height: 90px; }
  #debug pre { margin: 6px 0 0; white-space: pre-wrap; font-size: 11px; line-height: 1.35; }
  #bar { position: fixed; left: 8px; right: 8px; bottom: 8px; background: #000c; padding: 6px 8px; border-radius: 6px; display: flex; gap: 8px; align-items: center; }
  #bar button { min-width: 2.4em; }
  #tName { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #bbb; }
  #prog { flex: 1; height: 10px; background: #333; border-radius: 5px; cursor: pointer; position: relative; overflow: hidden; touch-action: none; }
  #prog.off { opacity: .35; cursor: default; }
  #progFill { position: absolute; inset: 0 auto 0 0; width: 0; background: #7fe3ff; border-radius: 5px; }
  #tTime { min-width: 8em; text-align: right; font-variant-numeric: tabular-nums; }
  .hide { display: none !important; }
  #toast { position: fixed; left: 50%; bottom: 72px; transform: translate(-50%, 12px); background: #000d; color: #fff; padding: 8px 16px; border-radius: 18px; font: 15px system-ui, sans-serif; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  #tvote { position: fixed; right: 8px; bottom: 52px; max-width: 340px; background: #000c; padding: 6px 8px; border-radius: 6px; }
  #tvote .trow { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; }
  #tvote .tvoted, #tvote .tpick { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px; }
  #tvote .trow button { font-size: 18px; background: none; border: 0; cursor: pointer; min-width: 36px; min-height: 36px; padding: 2px 6px; }
  #tvote .trow button:disabled { opacity: .3; cursor: default; }
  #tvote .tpick button { border: 1px solid #555; border-radius: 4px; }
  #tvote .tpick span { min-width: 10em; text-align: center; }
  #tvote .tnote { color: #999; }
  #panel, #bar, #hosts, #tvote { transition: opacity .4s; }
  body.idle #panel, body.idle #bar, body.idle #hosts, body.idle #tvote { opacity: 0; pointer-events: none; }
  body.idle { cursor: none; }
  /* hidden by double-tap: stays hidden until the next one */
  body.ui-off :is(#panel, #bar, #hosts, #hud, #debug, #tvote) { opacity: 0; visibility: hidden; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <button id="fileBtn" title="one or more audio files (mp3, wav, flac, ogg, m4a, ...)">files</button>
  <button id="folderBtn" title="every audio file in a folder, played in order">folder</button>
  <input type="file" id="file" multiple hidden>
  <input type="file" id="folder" webkitdirectory multiple hidden>
  <button id="capture" title="Use music already playing in another tab or app">capture tab / app audio</button>
  <button id="live">mic / line-in</button>
  <button id="stop">stop</button>
  <label><input type="checkbox" id="aud"> audio here</label>
  <span id="media" title="pictures for this screen only"></span>
  <label>offset ms <input type="number" id="off" step="5" style="width:5em"></label>
  <span>scene <button id="prev" title="previous scene ([)">&lt;</button> <select id="scene"></select> <button id="next" title="next scene (])">&gt;</button></span>
  <label>on <select id="quant"><option value="beat">beat</option><option value="bar" selected>bar</option><option value="now">now</option></select></label>
  <label title="transition for every scene switch (random: the server picks, never the same twice)">transition <select id="trans"></select></label>
  <label title="transition length in beats, following the room's tempo">length <select id="tlen"></select></label>
  <label title="the server switches to a scene picked by vote weight (👍 doubles, 👎 halves), with this transition">auto <select id="auto"></select></label>
  <button id="hit" title="manual hit (space)">hit</button>
  <button id="midi" title="relay this host's MIDI inputs (clock, notes, CCs)">midi</button>
  <button id="hostsBtn">hosts</button>
  <button id="dbgBtn" title="debug panel (d)">debug</button>
  <button id="fs">fullscreen</button>
  <a href="/gallery.html" style="color:#8a8a8a">gallery</a>
  <span id="msg"></span>
</div>
<div id="hosts" class="hide"></div>
<div id="hud" class="hide"></div>
<div id="bar">
  <button id="tPrev" title="previous / restart">⏮</button>
  <button id="tPlay" title="play / pause (p)">▶</button>
  <button id="tNext" title="next track">⏭</button>
  <span id="tName"></span>
  <div id="prog" title="click or drag to seek (← → ±10 s)"><div id="progFill"></div></div>
  <span id="tTime"></span>
</div>
<div id="tvote"></div>
<div id="err"></div>
<div id="toast" title="scene votes: + / - keys, or Select+△ / Select+✕ on a pad; transition votes: . / , keys"></div>
<audio id="au" preload="auto"></audio>
<script type="module" src="/src/web/main.ts"></script>
</body>
</html>
