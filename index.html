<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>einklang</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px ui-monospace, Consolas, monospace; color: #ddd; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #hud { position: fixed; left: 8px; bottom: 8px; background: #000a; padding: 6px 8px; white-space: pre; pointer-events: none; border-radius: 4px; }
  #panel { position: fixed; top: 8px; left: 8px; background: #000c; padding: 8px; display: flex; gap: 6px; flex-wrap: wrap; align-items: center; max-width: 95vw; border-radius: 6px; }
  button, input, select { font: inherit; background: #222; color: #ddd; border: 1px solid #555; padding: 4px 6px; border-radius: 3px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #f88; text-align: center; padding: 2em; }
  #hosts { position: fixed; top: 64px; left: 8px; background: #000c; padding: 8px; border-radius: 6px; display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: center; }
  #hosts .me { color: #7fe3ff; }
  .row { display: contents; }
  .hide { display: none !important; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="panel">
  <label>track <input type="file" id="file" accept="audio/*"></label>
  <button id="capture" title="Use music already playing in another tab or app">capture tab / app audio</button>
  <button id="live">mic / line-in</button>
  <button id="stop">stop</button>
  <label><input type="checkbox" id="aud"> audio here</label>
  <label>offset ms <input type="number" id="off" step="5" style="width:5em"></label>
  <span>scene <button id="prev" title="previous scene ([)">&lt;</button> <select id="scene"></select> <button id="next" title="next scene (])">&gt;</button></span>
  <label>on <select id="quant"><option value="beat">beat</option><option value="bar" selected>bar</option><option value="now">now</option></select></label>
  <button id="hit" title="manual hit (space)">hit</button>
  <button id="hostsBtn">hosts</button>
  <button id="fs">fullscreen</button>
  <a href="/gallery.html" style="color:#8a8a8a">gallery</a>
  <span id="msg"></span>
</div>
<div id="hosts" class="hide"></div>
<div id="hud"></div>
<div id="err"></div>
<audio id="au" preload="auto"></audio>
<script type="module" src="/src/web/main.ts"></script>
</body>
</html>
