<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>einklang</title>
<style>
  :root { color-scheme: dark; }
  html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font: 12px ui-monospace, Consolas, monospace; color: #ddd; touch-action: manipulation; }
  canvas { display: block; width: 100vw; height: 100vh; }
  #c { touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #hud { position: fixed; left: 10px; top: 62px; max-width: calc(100vw - 36px); background: #000a; padding: 6px 8px; white-space: pre-wrap; pointer-events: none; border-radius: 4px; }
  button, input, select { font: inherit; background: #222; color: #ddd; border: 1px solid #555; padding: 4px 6px; border-radius: 3px; }
  #err { position: fixed; inset: 0; display: none; place-items: center; color: #f88; text-align: center; padding: 2em; }
  /* the menu's room tab (menusheet.ts styles the rest of the sheet) */
  #room { display: flex; flex-direction: column; gap: 10px; }
  #room .options { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #room label { display: flex; align-items: center; gap: 6px; min-height: 40px; }
  #room input[type=number] { width: 5em; font-size: 16px; min-height: 32px; background: #000; color: #ddd; border: 1px solid #ffffff1f; border-radius: 6px; }
  #room a { color: #8a8a8a; }
  #hosts { display: grid; grid-template-columns: auto auto; gap: 4px 10px; align-items: center; justify-content: start; }
  #hosts .me { color: #7fe3ff; }
  #debug { position: fixed; top: 8px; right: 8px; z-index: 5; background: #000d; padding: 8px; border-radius: 6px; max-width: min(640px, 60vw); max-height: 92vh; overflow: auto; }
  #debug > canvas { width: 600px; max-width: 100%; height: 90px; }
  #debug .perf { width: 600px; max-width: 100%; margin-bottom: 6px; }
  /* a phone: the panel spans the screen, below the menu button */
  @media (max-width: 640px) { #debug { left: 8px; top: calc(60px + env(safe-area-inset-top)); max-width: none; max-height: calc(100dvh - 200px); overscroll-behavior: contain; } }
  #debug pre { margin: 6px 0 0; white-space: pre-wrap; font-size: 11px; line-height: 1.35; }
  #bar { position: fixed; left: 8px; right: 8px; bottom: calc(8px + env(safe-area-inset-bottom)); background: #000c; padding: 6px 8px; border-radius: 6px; display: flex; gap: 8px; align-items: center; }
  #bar button { min-width: 2.4em; }
  #tName { max-width: 30vw; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: #bbb; }
  #prog { flex: 1; height: 10px; background: #333; border-radius: 5px; cursor: pointer; position: relative; overflow: hidden; touch-action: none; }
  #prog.off { opacity: .35; cursor: default; }
  #progFill { position: absolute; inset: 0 auto 0 0; width: 0; background: #7fe3ff; border-radius: 5px; }
  #tTime { min-width: 8em; text-align: right; font-variant-numeric: tabular-nums; }
  .hide { display: none !important; }
  #toast { position: fixed; left: 50%; bottom: 72px; transform: translate(-50%, 12px); background: #000d; color: #fff; padding: 8px 16px; border-radius: 18px; font: 15px system-ui, sans-serif; opacity: 0; transition: opacity .2s, transform .2s; pointer-events: none; }
  #toast.on { opacity: 1; transform: translate(-50%, 0); }
  /* the vote panel (votepanel.ts) sits above the transport bar */
  #vote { right: 8px; bottom: calc(52px + env(safe-area-inset-bottom)); }
  #bar { transition: opacity .4s; }
  body.idle #bar { opacity: 0; pointer-events: none; }
  /* hidden by double-tap: stays hidden until the next one */
  body.ui-off :is(#bar, #hud, #debug) { opacity: 0; visibility: hidden; pointer-events: none; }
</style>
</head>
<body>
<canvas id="c"></canvas>
<!-- The ☰ menu (menusheet.ts) holds the controls. These fields keep what they set (scripts such as the e2e set them too). -->
<div id="ctl" hidden>
  <select id="scene" title="scene"></select>
  <select id="quant" title="switch on"><option value="beat">beat</option><option value="bar" selected>bar</option><option value="now">now</option></select>
  <select id="trans" title="transition for every scene switch (random: the server picks, never the same twice)"></select>
  <select id="tlen" title="transition length in beats, following the room's tempo"></select>
  <select id="auto" title="the server switches to a scene picked by vote weight (👍 doubles, 👎 halves), with this transition"></select>
</div>
<input type="file" id="file" multiple hidden><input type="file" id="folder" webkitdirectory multiple hidden>
<!-- the menu's room tab: this host and the room -->
<div id="room">
  <div id="roomLine" class="dim"></div>
  <div class="options">
    <label title="play the room's track on this device too"><input type="checkbox" id="aud"> audio here</label>
    <label title="display latency trim for this screen">offset ms <input type="number" id="off" step="5"></label>
  </div>
  <div class="options">
    <button id="hit" type="button" title="manual hit (space)">hit</button>
    <button id="midi" type="button" title="relay this host's MIDI inputs (clock, notes, CCs)">midi</button>
    <span id="padsLine" class="dim"></span>
  </div>
  <h3>hosts (the view each screen shows)</h3>
  <div id="hosts"></div>
  <p class="dim">keys: + - vote scene · . , vote transition · [ ] scene · space hit · 0-9 section cue · p play · ← → seek · o menu · h UI · i HUD · d debug</p>
  <a href="/gallery.html">gallery</a>
</div>
<div id="hud" class="hide"></div>
<div id="bar">
  <button id="tPrev" title="previous / restart">⏮</button>
  <button id="tPlay" title="play / pause (p)">▶</button>
  <button id="tNext" title="next track">⏭</button>
  <span id="tName"></span>
  <div id="prog" title="click or drag to seek (← → ±10 s)"><div id="progFill"></div></div>
  <span id="tTime"></span>
</div>
<div id="err"></div>
<div id="toast" title="scene votes: + / - keys, or Select+△ / Select+✕ on a pad; transition votes: . / , keys"></div>
<audio id="au" preload="auto"></audio>
<script type="module" src="/src/web/main.ts"></script>
</body>
</html>
