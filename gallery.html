<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>einklang · scene gallery</title>
<style>
  :root { color-scheme: dark; --fg: #d8d8d8; --dim: #8a8a8a; --line: #ffffff1f; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden; font: 12px/1.4 ui-monospace, Consolas, monospace; touch-action: manipulation; }
  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #stage { position: fixed; inset: 0; display: grid; gap: 2px; background: #111; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage.grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .cell { position: relative; background: #000; min-width: 0; min-height: 0; }
  .cell canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: absolute; left: 10px; top: 8px; color: var(--dim); pointer-events: none; text-shadow: 0 0 4px #000; }
  #hud { position: fixed; left: 10px; top: 62px; max-width: calc(100vw - 36px); padding: 6px 8px; background: #000a; white-space: pre-wrap; pointer-events: none; border-radius: 4px; }
  #perf { position: fixed; right: 10px; top: 10px; z-index: 5; box-sizing: border-box; width: min(480px, calc(100vw - 20px)); max-height: calc(100vh - 200px); max-height: calc(100dvh - 200px); overflow: auto; overscroll-behavior: contain; padding: 8px; background: #000d; border: 1px solid var(--line); border-radius: 6px; }
  /* a phone: below the picker button */
  @media (max-width: 640px) { #perf { top: calc(60px + env(safe-area-inset-top)); max-height: calc(100dvh - 240px); } }
  @media (max-height: 500px) { #perf { max-height: calc(100dvh - 20px - env(safe-area-inset-bottom)); } }
  #err { user-select: text; -webkit-user-select: text; position: fixed; inset: 0; display: none; place-items: center; text-align: center; color: #f88; padding: 2em; }
  button, input, select { font: inherit; touch-action: manipulation; }
  #tools { position: fixed; left: 10px; top: 10px; max-width: calc(100vw - 20px); display: flex; align-items: center; gap: 8px; }
  #tools button { min-height: 40px; padding: 6px 14px; color: var(--fg); background: #000b; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; backdrop-filter: blur(6px); }
  #status { min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; color: var(--dim); text-shadow: 0 0 4px #000; }
  #vote { position: fixed; right: 10px; bottom: 10px; max-width: min(360px, calc(100vw - 36px)); display: flex; flex-direction: column; align-items: flex-end; gap: 4px; padding: 6px 8px; background: #000b; border: 1px solid var(--line); border-radius: 6px; }
  #vote .srow, #vote .tvoted, #vote .tpick { display: flex; flex-wrap: wrap; align-items: center; justify-content: flex-end; gap: 4px; }
  #vote .trow { display: flex; flex-direction: column; align-items: flex-end; gap: 4px; width: 100%; padding-top: 4px; border-top: 1px solid var(--line); }
  #vote button { font-size: 18px; color: var(--fg); background: none; border: 0; cursor: pointer; min-width: 40px; min-height: 40px; padding: 2px 6px; }
  #vote button:disabled { opacity: .3; cursor: default; }
  #vote :is(button.prev, button.next) { border: 1px solid var(--line); border-radius: 6px; }
  #vote .tpick span { min-width: 12em; text-align: center; }
  #vote :is(.note, .tnote) { color: var(--dim); }
  #sheet { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: #0008; cursor: pointer; }
  #sheet .box { cursor: auto; display: flex; flex-direction: column; width: min(620px, 100%); height: min(720px, 86vh); height: min(720px, 86dvh); background: #0d0d0df2; border: 1px solid var(--line); border-radius: 10px; font-size: 13px; outline: none; }
  #sheet .tabs { display: flex; gap: 2px; padding: 6px; border-bottom: 1px solid var(--line); }
  #sheet .tabs button { flex: 1 1 auto; min-width: 0; padding: 4px 2px; border-color: transparent; font-size: 12px; }
  #sheet .tabs .close { flex: 0 0 40px; }
  #sheet .body { flex: 1; overflow: auto; overscroll-behavior: contain; padding: 8px 10px max(10px, env(safe-area-inset-bottom)); }
  #sheet button { min-height: 40px; padding: 6px 10px; color: var(--fg); background: none; border: 1px solid var(--line); border-radius: 6px; cursor: pointer; }
  #sheet button[aria-pressed=true] { color: #000; background: var(--fg); }
  #sheet button[aria-pressed=true] .dim { color: #333; }
  #sheet button:disabled { opacity: .35; cursor: default; }
  /* 16px: iOS zooms into smaller fields */
  #sheet :is(input[type=search], input[readonly], select) { font-size: 16px; min-height: 40px; color: var(--fg); background: #000; border: 1px solid var(--line); border-radius: 6px; padding: 4px 8px; user-select: text; -webkit-user-select: text; }
  #sheet .search { display: flex; gap: 6px; }
  #sheet .search input { flex: 1; min-width: 0; }
  #sheet .chips { display: flex; flex-wrap: nowrap; gap: 4px; overflow-x: auto; padding: 8px 0; }
  #sheet .chip { flex: none; border-radius: 20px; }
  #sheet .chip.vendor { border-style: dashed; }
  #sheet .list { display: flex; flex-direction: column; gap: 3px; }
  #sheet .row { display: grid; grid-template-columns: 1fr auto; column-gap: 10px; align-items: center; text-align: left; }
  #sheet .row .name { overflow-wrap: anywhere; }
  #sheet .options { display: flex; flex-wrap: wrap; gap: 6px; }
  #sheet .field { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-top: 10px; }
  #sheet .restart { display: flex; flex-wrap: wrap; align-items: center; gap: 10px; margin-top: 24px; padding-top: 10px; border-top: 1px solid var(--line); }
  #sheet .restart label { display: flex; align-items: center; gap: 6px; min-height: 40px; }
  #sheet .restart .out { width: 100%; max-height: 30vh; overflow: auto; margin: 0; color: #f88; font-family: monospace; white-space: pre-wrap; user-select: text; -webkit-user-select: text; }
  #sheet h3 { margin: 12px 0 6px; font-size: 13px; }
  #sheet h3:first-child { margin-top: 0; }
  #sheet .dim { color: var(--dim); }
  #sheet .key { overflow-wrap: anywhere; user-select: text; -webkit-user-select: text; }
  #sheet .said:empty { display: none; }
  #sheet .said { display: flex; flex-direction: column; gap: 4px; padding: 6px 10px; }
  #input { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; }
  #input .note { width: 100%; color: var(--dim); }
  #input :is(.sharevideo, .media label) { display: flex; align-items: center; gap: 6px; min-height: 40px; color: var(--dim); cursor: pointer; }
  #input .media { display: contents; }
  #input .media [hidden] { display: none; }
  @media (max-width: 640px) {
    /* a phone: the picker is a bottom sheet */
    #sheet { align-items: flex-end; }
    #sheet .box { border-radius: 12px 12px 0 0; border-width: 1px 0 0; }
  }
  #tools, #vote { transition: opacity .4s; }
  body.idle :is(#tools, #vote) { opacity: 0; pointer-events: none; }
  /* hidden by double-tap: stays hidden until the next one */
  body.ui-off :is(#tools, #vote, #hud, #perf, .tag) { opacity: 0; visibility: hidden; pointer-events: none; }
  body.idle:not(.sheet-open) { cursor: none; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="hud"></div>
<div id="err"></div>
<script type="module" src="/src/web/gallery.ts"></script>
</body>
</html>
