<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<link rel="icon" href="data:,">
<title>einklang · scene gallery</title>
<style>
  :root { color-scheme: dark; --fg: #d8d8d8; --dim: #8a8a8a; --line: #ffffff1f; }
  html, body { margin: 0; height: 100%; background: #000; color: var(--fg); overflow: hidden; font: 12px/1.4 ui-monospace, Consolas, monospace; touch-action: manipulation; }
  body { user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; }
  #stage { position: fixed; inset: 0; display: grid; gap: 2px; background: #111; touch-action: manipulation; user-select: none; -webkit-user-select: none; -webkit-tap-highlight-color: transparent; }
  #stage.grid { grid-template-columns: 1fr 1fr; grid-template-rows: 1fr 1fr; }
  .cell { position: relative; background: #000; min-width: 0; min-height: 0; }
  .cell canvas { position: absolute; inset: 0; width: 100%; height: 100%; display: block; }
  .tag { position: absolute; left: 10px; top: 8px; color: var(--dim); pointer-events: none; text-shadow: 0 0 4px #000; }
  #bar { position: fixed; top: 10px; left: 50%; transform: translateX(-50%); display: flex; gap: 2px; padding: 3px; background: #000b; border: 1px solid var(--line); border-radius: 6px; backdrop-filter: blur(6px); }
  #bar button { font: inherit; color: var(--dim); background: none; border: 0; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  #bar button:hover { color: var(--fg); }
  #bar button[aria-pressed=true] { color: #000; background: var(--fg); }
  #bar select { font: inherit; color: var(--dim); background: #000; border: 1px solid var(--line); border-radius: 4px; padding: 3px 6px; }
  #hud { position: fixed; left: 10px; bottom: 52px; padding: 6px 8px; background: #000a; white-space: pre; pointer-events: none; border-radius: 4px; }
  #err { user-select: text; -webkit-user-select: text; position: fixed; inset: 0; display: none; place-items: center; text-align: center; color: #f88; padding: 2em; }
  #vote { position: fixed; right: 10px; bottom: 10px; max-width: 340px; display: flex; flex-wrap: wrap; align-items: center; gap: 4px; padding: 6px 8px; background: #000b; border: 1px solid var(--line); border-radius: 6px; }
  #vote > button, #vote .trow > button { font-size: 18px; background: none; border: 0; cursor: pointer; padding: 2px 6px; }
  #vote > button:disabled, #vote .trow > button:disabled { opacity: .3; cursor: default; }
  #vote .note, #vote .tnote { color: var(--dim); }
  #vote .trow { display: flex; flex-wrap: wrap; align-items: center; gap: 4px; width: 100%; margin-top: 4px; padding-top: 4px; border-top: 1px solid var(--line); }
  #vote .tags, #vote .ttags { display: flex; flex-wrap: wrap; gap: 3px; width: 100%; }
  #vote .tags button, #vote .ttags button { font: inherit; font-size: 11px; color: var(--dim); background: none; border: 1px solid var(--line); border-radius: 10px; padding: 2px 7px; cursor: pointer; }
  #vote .tags button[aria-pressed=true], #vote .ttags button[aria-pressed=true] { color: #000; background: var(--fg); }
  #input { position: fixed; left: 10px; bottom: 10px; max-width: calc(100vw - 20px); display: flex; flex-wrap: wrap; align-items: center; gap: 2px; padding: 3px; background: #000b; border: 1px solid var(--line); border-radius: 6px; }
  #input button { font: inherit; color: var(--dim); background: none; border: 0; padding: 5px 10px; border-radius: 4px; cursor: pointer; }
  #input button:hover { color: var(--fg); }
  #input button[aria-pressed=true] { color: #000; background: var(--fg); }
  #input .note:not(:empty) { color: var(--dim); padding: 0 6px; }
  @media (max-width: 800px) {
    #input { bottom: 130px; } #hud { bottom: 200px !important; }
    /* the transition row makes the vote panel taller */
    body:has(#vote .trow:not(.hide)) #input { bottom: 250px; } body:has(#vote .trow:not(.hide)) #hud { bottom: 320px !important; }
  }
  #bar, #vote, #input { transition: opacity .4s; }
  body.idle :is(#bar, #vote, #input) { opacity: 0; pointer-events: none; }
  /* hidden by double-tap: stays hidden until the next one */
  body.ui-off :is(#bar, #vote, #input, #hud, .tag) { opacity: 0; visibility: hidden; pointer-events: none; }
  body.idle { cursor: none; }
  .hide { display: none !important; }
</style>
</head>
<body>
<div id="stage"></div>
<nav id="bar"></nav>
<div id="hud"></div>
<div id="err"></div>
<script type="module" src="/src/web/gallery.ts"></script>
</body>
</html>
